<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Grace House</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" />
<style>
:root {
  --screen-width:  2436px;
  --screen-height: 783px;

  --gh-cream:        #E5E5DA;
  --gh-cream-dim:    rgba(229, 229, 218, 0.72);
  --gh-cream-faint:  rgba(229, 229, 218, 0.42);
  --gh-line:         rgba(229, 229, 218, 0.22);

  --font-serif: 'Cormorant Garamond', serif;
  --font-mono:  'IBM Plex Mono', ui-monospace, monospace;

  --u: calc(var(--screen-height) / 100);

  /* timing: 6 photos × 27s = 162s cycle */
  --cycle: 162s;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: #000;
  cursor: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.stage {
  /* Anchored to top-left at native 2436 × 783.
     The Colorlight X8E is configured to capture exactly the top-left
     2436 × 783 rectangle of the HDMI input, so all content must live
     in that region. The NUC outputs 2560 × 1080; the right 124 px and
     bottom 297 px of the viewport are dead space (black, never shown
     on the panel). */
  position: absolute;
  top: 0;
  left: 0;
  width: var(--screen-width);
  height: var(--screen-height);
  background: #000;
  overflow: hidden;
  color: var(--gh-cream);
}

/* -------- aerial layers (Ken Burns + crossfade across 6 photos) -------- */
.aerial {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0;
  will-change: opacity, transform;
  animation:
    aerial-fade var(--cycle) ease-in-out infinite,
    aerial-push var(--cycle) ease-in-out infinite;
}
/* six photos staggered by 27s through the 162s cycle */
.aerial:nth-child(1) { animation-delay:    0s,    0s; }
.aerial:nth-child(2) { animation-delay:  -27s,  -27s; }
.aerial:nth-child(3) { animation-delay:  -54s,  -54s; }
.aerial:nth-child(4) { animation-delay:  -81s,  -81s; }
.aerial:nth-child(5) { animation-delay: -108s, -108s; }
.aerial:nth-child(6) { animation-delay: -135s, -135s; }

/* visible window = 1/6 of cycle (~16.67%); fade in/out at the edges */
@keyframes aerial-fade {
  0%   { opacity: 0; }
  3%   { opacity: 1; }
  14%  { opacity: 1; }
  17%  { opacity: 0; }
  100% { opacity: 0; }
}

/* gentle forward push: slow zoom + slight upward drift during the visible window */
@keyframes aerial-push {
  0%   { transform: scale(1.00) translate(0, 0); }
  17%  { transform: scale(1.14) translate(0, -1.5%); }
  18%  { transform: scale(1.00) translate(0, 0); }   /* reset while invisible */
  100% { transform: scale(1.00) translate(0, 0); }
}

/* -------- legibility scrim -------- */
.scrim {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.22) 28%,
      rgba(0,0,0,0.00) 50%
    ),
    linear-gradient(180deg,
      rgba(0,0,0,0.48) 0%,
      rgba(0,0,0,0.00) 14%
    ),
    linear-gradient(0deg,
      rgba(0,0,0,0.30) 0%,
      rgba(0,0,0,0.00) 12%
    );
}

/* -------- top banner -------- */
.banner {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: calc(var(--u) * 7);
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--gh-line);
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: calc(var(--u) * 3.4);
  letter-spacing: 0.46em;
  text-transform: uppercase;
  color: var(--gh-cream);
  padding-left: 0.46em;
}

/* -------- left clock -------- */
.clock {
  position: absolute;
  left: calc(var(--u) * 5);
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 6);
}
.clock-time {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: calc(var(--u) * 22);
  line-height: 0.85;
  letter-spacing: -0.02em;
  color: var(--gh-cream);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.6) rgba(0,0,0,0.55);
}
.clock-meta {
  display: flex;
  align-items: baseline;
  gap: calc(var(--u) * 1.6);
  font-family: var(--font-mono);
  font-size: calc(var(--u) * 1.6);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gh-cream-dim);
  font-variant-numeric: tabular-nums;
}
.clock-date { color: var(--gh-cream); }
.clock-zone { color: var(--gh-cream-faint); }

/* -------- bottom mark -------- */
.mark {
  position: absolute;
  bottom: calc(var(--u) * 2);
  right: calc(var(--u) * 5);
  font-family: var(--font-mono);
  font-size: calc(var(--u) * 1.3);
  letter-spacing: 0.46em;
  text-transform: uppercase;
  color: var(--gh-cream-faint);
  padding-left: 0.46em;
}
</style>
</head>
<body>
  <div class="stage" id="stage">

    <!-- six aerials -->
    <div class="aerial" style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=3840&q=92&auto=format&fit=crop');"></div>
    <div class="aerial" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=3840&q=92&auto=format&fit=crop');"></div>
    <div class="aerial" style="background-image: url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=5120&q=95&auto=format&fit=crop');"></div>
    <div class="aerial" style="background-image: url('https://images.unsplash.com/photo-1577897181176-a220d04736f7?w=5120&q=95&auto=format&fit=crop');"></div>
    <div class="aerial" style="background-image: url('https://images.unsplash.com/photo-1508922450598-2f5b1193950a?w=5120&q=95&auto=format&fit=crop');"></div>
    <div class="aerial" style="background-image: url('https://images.unsplash.com/photo-1641571978358-8049740c509f?w=5120&q=95&auto=format&fit=crop');"></div>

    <div class="scrim"></div>

    <header class="banner">GRACE HOUSE</header>

    <div class="clock">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-meta">
        <span class="clock-date" id="clockDate">—</span>
        <span class="clock-zone">SYDNEY · AEST</span>
      </div>
    </div>

    <div class="mark">279 CLARENCE ST</div>

  </div>

<script>
(() => {
  'use strict';
  // Stage is anchored to the top-left at native 2436×783 (matches the
  // X8E's capture rectangle on the LED panel). No scaling needed.

  const $time = document.getElementById('clockTime');
  const $date = document.getElementById('clockDate');
  function tickClock() {
    const now = new Date();
    const tz = 'Australia/Sydney';
    $time.textContent = new Intl.DateTimeFormat('en-AU', {
      timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
    }).format(now);
    $date.textContent = new Intl.DateTimeFormat('en-AU', {
      timeZone: tz, weekday: 'long', day: 'numeric', month: 'long',
    }).format(now).toUpperCase();
  }
  tickClock();
  setInterval(tickClock, 1000 * 30);
})();
</script>
</body>
</html>
