<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grace House Lobby  Option B (Cinematic)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="preview-wrapper">
    <div class="stage">

      <header class="header">
        <div class="time"><span id="clock">--:--</span><span class="date" id="date"></span></div>
        <div class="weather">
          <span class="temp" data-wx-temp></span>
          <span class="cond" data-wx-cond>Sydney</span>
        </div>
        <div class="forecast" data-forecast>
          <span><em></em> </span>
          <span><em></em> </span>
          <span><em></em> </span>
        </div>
      </header>

      <main class="grid">

        <section class="sports">
          <div class="tile tile-markets" data-tile="markets-hero">
            <div class="mkt">
              <div class="mkt-head">
                <span class="mkt-title">Markets</span>
                <span class="mkt-meta"><span class="dot"></span><span data-mkt-meta>ASX · LIVE</span></span>
              </div>
              <div class="mkt-hero">
                <div class="mkt-row" data-mkt-row="^AXJO">
                  <div class="mkt-lbl">ASX 200</div>
                  <svg class="mkt-spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline data-spark points=""/></svg>
                  <div class="mkt-num" data-num></div>
                  <div class="mkt-dlt" data-dlt></div>
                </div>
                <div class="mkt-row" data-mkt-row="^GSPC">
                  <div class="mkt-lbl">S&amp;P 500</div>
                  <svg class="mkt-spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline data-spark points=""/></svg>
                  <div class="mkt-num" data-num></div>
                  <div class="mkt-dlt" data-dlt></div>
                </div>
                <div class="mkt-row" data-mkt-row="^N225">
                  <div class="mkt-lbl">NIKKEI</div>
                  <svg class="mkt-spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline data-spark points=""/></svg>
                  <div class="mkt-num" data-num></div>
                  <div class="mkt-dlt" data-dlt></div>
                </div>
              </div>
            </div>
          </div>
          <div class="tile tile-markets" data-tile="markets-hero-2">
            <div class="mkt">
              <div class="mkt-head">
                <span class="mkt-title">Currencies</span>
                <span class="mkt-meta"><span class="dot"></span><span data-mkt-meta>FX · METALS · CRYPTO</span></span>
              </div>
              <div class="mkt-hero">
                <div class="mkt-row" data-mkt-row="AUDUSD=X">
                  <div class="mkt-lbl">AUD/USD</div>
                  <svg class="mkt-spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline data-spark points=""/></svg>
                  <div class="mkt-num" data-num></div>
                  <div class="mkt-dlt" data-dlt></div>
                </div>
                <div class="mkt-row" data-mkt-row="GC=F">
                  <div class="mkt-lbl">Gold</div>
                  <svg class="mkt-spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline data-spark points=""/></svg>
                  <div class="mkt-num" data-num></div>
                  <div class="mkt-dlt" data-dlt></div>
                </div>
                <div class="mkt-row" data-mkt-row="BTC">
                  <div class="mkt-lbl">BTC</div>
                  <svg class="mkt-spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline data-spark points=""/></svg>
                  <div class="mkt-num" data-num></div>
                  <div class="mkt-dlt" data-dlt></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="hero">
          <video id="heroA" src="../assets/hero.mov" muted playsinline preload="auto"></video>
          <video id="heroB" src="../assets/hero.mov" muted playsinline preload="auto"></video>
          <div class="hero-corner">GRACE HOUSE</div>
          <div class="hero-handle">@khedoori</div>
        </section>

        <section class="rightcol">
          <div class="panel stocks">
            <h3>Markets</h3>
            <ul data-rc-stocks>
              <li data-rc-row="^AXJO"><span class="lbl">ASX 200</span><span class="num" data-num></span><span data-dlt></span></li>
              <li data-rc-row="^GSPC"><span class="lbl">S&amp;P 500</span><span class="num" data-num></span><span data-dlt></span></li>
              <li data-rc-row="^N225"><span class="lbl">NIKKEI</span><span class="num" data-num></span><span data-dlt></span></li>
              <li data-rc-row="AUDUSD=X"><span class="lbl">AUD/USD</span><span class="num" data-num></span><span data-dlt></span></li>
              <li data-rc-row="GC=F"><span class="lbl">Gold (USD/oz)</span><span class="num" data-num></span><span data-dlt></span></li>
              <li data-rc-row="BTC"><span class="lbl">Bitcoin</span><span class="num" data-num></span><span data-dlt></span></li>
            </ul>
          </div>
          <div class="panel news">
            <h3 data-news-head>Headlines</h3>
            <ul data-news>
              <li>Loading…</li>
            </ul>
          </div>
        </section>

      </main>

      <footer class="ticker">
        <div class="ticker-track" data-ticker>
          <span>Loading live data…</span>
        </div>
      </footer>

    </div>
  </div>
  <script src="../shared/data.js"></script>
  <script src="app.js"></script>
</body>
</html>
